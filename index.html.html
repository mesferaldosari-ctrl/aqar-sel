<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>مشاريع عقار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-style">
  :root{
    --bg:#F6F3EC;
    --surface:#FFFFFF;
    --surface-2:#EFE9DA;
    --border:#E1D9C4;
    --ink:#221E17;
    --ink-dim:#6B6250;
    --primary:#008236;
    --primary-strong:#006229;
    --primary-ink:#FFFFFF;
    --accent:#2FA35A;
    --accent-ink:#FFFFFF;
    --success:#1D6FBF;
    --success-bg:#E1EDFA;
    --warning:#B4732A;
    --warning-bg:#F5E8D4;
    --danger:#A23F35;
    --danger-bg:#F5E1DD;
    --shadow: 0 1px 2px rgba(20,15,5,.06), 0 8px 24px -12px rgba(20,15,5,.18);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1512;
      --surface:#16201C;
      --surface-2:#1D2924;
      --border:#2A362F;
      --ink:#EDE8DD;
      --ink-dim:#9CA79E;
      --primary:#2FA35A;
      --primary-strong:#1F7A42;
      --primary-ink:#06210F;
      --accent:#57C27E;
      --accent-ink:#06210F;
      --success:#5B9FE0;
      --success-bg:#122A40;
      --warning:#D99A4E;
      --warning-bg:#302410;
      --danger:#D06B5C;
      --danger-bg:#331D18;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1512;
    --surface:#16201C;
    --surface-2:#1D2924;
    --border:#2A362F;
    --ink:#EDE8DD;
    --ink-dim:#9CA79E;
    --primary:#2FA35A;
    --primary-strong:#1F7A42;
    --primary-ink:#06210F;
    --accent:#57C27E;
    --accent-ink:#06210F;
    --success:#5B9FE0;
    --success-bg:#122A40;
    --warning:#D99A4E;
    --warning-bg:#302410;
    --danger:#D06B5C;
    --danger-bg:#331D18;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
    font-size:15px;
    line-height:1.55;
    min-height:100vh;
  }
  h1,h2,h3,.brand{font-family:"Cairo","IBM Plex Sans Arabic",sans-serif;text-wrap:balance;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
  a{color:inherit;}
  ::selection{background:var(--accent);color:var(--accent-ink);}

  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Login screen ---------- */
  .login-wrap{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:32px 16px;
    background:
      radial-gradient(1100px 480px at 20% -10%, color-mix(in srgb, var(--primary) 22%, transparent), transparent),
      radial-gradient(900px 420px at 100% 110%, color-mix(in srgb, var(--accent) 16%, transparent), transparent);
  }
  .login-card{
    width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:36px 30px;
  }
  .brand-mark{
    width:56px;height:56px;border-radius:14px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
    box-shadow:0 6px 18px -6px color-mix(in srgb, var(--primary) 60%, transparent);
  }
  .brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .brand-title{text-align:center;font-size:22px;font-weight:800;margin:0 0 4px;}
  .brand-sub{text-align:center;color:var(--ink-dim);font-size:13.5px;margin:0 0 28px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-dim);margin-bottom:6px;}
  .field input,.field select,.field textarea{
    width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink);outline:none;transition:border-color .15s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);}
  .field textarea{resize:vertical;min-height:72px;}
  .field .hint{font-size:11.5px;color:var(--ink-dim);margin-top:5px;}
  .field .hint a{color:var(--primary);font-weight:600;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 18px;border-radius:10px;border:1px solid transparent;
    font-weight:700;font-size:14px;cursor:pointer;transition:filter .15s,transform .05s;
  }
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.55;cursor:default;}
  .btn-primary{background:var(--primary);color:var(--primary-ink);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-accent{background:var(--accent);color:var(--accent-ink);}
  .btn-accent:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--border);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-danger{background:var(--danger-bg);color:var(--danger);}
  .btn-danger:hover{filter:brightness(0.97);}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
  .login-err{
    background:var(--danger-bg);color:var(--danger);border-radius:10px;padding:10px 12px;
    font-size:13px;margin-bottom:14px;display:none;
  }
  .login-err.show{display:block;}
  .login-hint{text-align:center;color:var(--ink-dim);font-size:12px;margin-top:18px;}

  /* ---------- Header ---------- */
  header.topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 24px;background:color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
  }
  .topbar-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .topbar-brand{display:flex;align-items:center;gap:10px;cursor:pointer;border:none;background:none;padding:0;}
  .topbar-brand .brand-mark{width:36px;height:36px;margin:0;border-radius:10px;}
  .topbar-brand .brand-name{font-weight:800;font-size:16px;}
  .role-pill{
    font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;
    background:var(--surface-2);color:var(--ink-dim);border:1px solid var(--border);white-space:nowrap;
  }
  .role-pill.admin{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  .sync-pill{
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;
    background:var(--surface-2);color:var(--ink-dim);border:1px solid var(--border);
  }
  .sync-pill.ok{background:var(--success-bg);color:var(--success);border-color:transparent;}
  .sync-pill.off{background:var(--warning-bg);color:var(--warning);border-color:transparent;}
  .topbar-right{display:flex;align-items:center;gap:10px;}

  main{flex:1;padding:24px;max-width:1180px;margin:0 auto;width:100%;}

  /* ---------- Info banner ---------- */
  .info-banner{
    display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);
    border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:20px;
  }
  .info-banner .ic{font-size:20px;line-height:1;}
  .info-banner p{margin:0;font-size:13.5px;color:var(--ink-dim);}
  .info-banner strong{color:var(--ink);}
  .info-banner .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}

  /* ---------- Stats ---------- */
  .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px;}
  .stat-tile{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow);
  }
  .stat-tile .num{font-family:"Cairo",sans-serif;font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;}
  .stat-tile .lbl{font-size:12.5px;color:var(--ink-dim);margin-top:2px;}
  .stat-tile.success .num{color:var(--success);}
  .stat-tile.warning .num{color:var(--warning);}
  .stat-tile.danger .num{color:var(--danger);}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .toolbar-left{display:flex;flex-wrap:wrap;gap:10px;flex:1;min-width:240px;}
  .toolbar-right{display:flex;flex-wrap:wrap;gap:10px;}
  .search-input{
    flex:1;min-width:180px;max-width:320px;padding:10px 14px;border-radius:10px;
    border:1px solid var(--border);background:var(--surface);color:var(--ink);outline:none;
  }
  .search-input:focus{border-color:var(--primary);}
  select.filter-select{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--ink);}

  h2.section-title{font-size:19px;font-weight:800;margin:0 0 16px;}

  /* ---------- Project grid ---------- */
  .project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}
  .project-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px;cursor:pointer;transition:border-color .15s, transform .1s;
    display:flex;flex-direction:column;gap:10px;
  }
  .project-card:hover{border-color:var(--primary);transform:translateY(-1px);}
  .project-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .project-card h3{margin:0;font-size:16.5px;font-weight:800;}
  .project-card .loc{font-size:12.5px;color:var(--ink-dim);margin-top:2px;}
  .status-tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .status-planning{background:var(--surface-2);color:var(--ink-dim);}
  .status-construction{background:var(--warning-bg);color:var(--warning);}
  .status-ready{background:var(--success-bg);color:var(--success);}
  .status-delivered{background:color-mix(in srgb, var(--primary) 16%, var(--surface-2));color:var(--primary);}
  .project-card-stats{display:flex;gap:14px;font-size:12.5px;color:var(--ink-dim);flex-wrap:wrap;}
  .project-card-stats b{color:var(--ink);font-variant-numeric:tabular-nums;}
  .project-card-updated{font-size:11px;color:var(--ink-dim);margin-top:auto;padding-top:8px;border-top:1px dashed var(--border);}
  .empty-state{
    grid-column:1/-1;text-align:center;padding:64px 20px;color:var(--ink-dim);
    background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);
  }
  .empty-state .ic{font-size:38px;margin-bottom:10px;}
  .empty-state h3{color:var(--ink);margin:0 0 6px;}

  /* ---------- Project detail ---------- */
  .back-link{
    display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);text-decoration:none;
    font-size:13px;font-weight:600;background:none;border:none;cursor:pointer;padding:0;margin-bottom:14px;
  }
  .back-link:hover{color:var(--primary);}
  .detail-head{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px 22px;box-shadow:var(--shadow);margin-bottom:20px;
    display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .detail-head h2{margin:0 0 4px;font-size:21px;}
  .detail-head .loc{color:var(--ink-dim);font-size:13.5px;margin-bottom:10px;}
  .detail-head .desc{font-size:13.5px;color:var(--ink-dim);max-width:60ch;}
  .detail-head-actions{display:flex;gap:8px;align-items:flex-start;}

  table.units-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
  table.units-table th{
    text-align:right;padding:12px 14px;font-size:11.5px;color:var(--ink-dim);font-weight:700;
    background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap;
  }
  table.units-table td{padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle;}
  table.units-table tbody tr:last-child td{border-bottom:none;}
  table.units-table tbody tr:hover{background:var(--surface-2);}
  td.num{font-variant-numeric:tabular-nums;}
  .feat-chips{display:flex;gap:5px;flex-wrap:wrap;max-width:220px;white-space:normal;}
  .chip{background:var(--surface-2);color:var(--ink-dim);border:1px solid var(--border);border-radius:999px;padding:2px 9px;font-size:11px;}
  .status-select{
    font-size:12px;font-weight:700;border-radius:999px;padding:5px 10px;border:1px solid transparent;
    cursor:pointer;appearance:none;-webkit-appearance:none;text-align:center;
  }
  .status-available{background:var(--success-bg);color:var(--success);}
  .status-reserved{background:var(--warning-bg);color:var(--warning);}
  .status-sold{background:var(--danger-bg);color:var(--danger);}
  .status-badge{font-size:12px;font-weight:700;border-radius:999px;padding:5px 12px;display:inline-block;}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{
    border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 9px;
    cursor:pointer;font-size:13px;color:var(--ink-dim);
  }
  .icon-btn:hover{color:var(--ink);background:var(--surface-2);}
  .no-units{padding:40px;text-align:center;color:var(--ink-dim);}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,12,7,.5);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;overflow-y:auto;
  }
  .modal-box{
    background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
    width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:26px 26px 22px;border:1px solid var(--border);
    position:relative;margin:auto;
  }
  .modal-box.wide{max-width:640px;}
  .modal-box h3{margin:0 0 18px;font-size:18px;font-weight:800;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;justify-content:flex-start;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap;}
  .modal-close{position:absolute;top:14px;left:14px;}
  .import-textarea{width:100%;min-height:160px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:11px 13px;font-family:ui-monospace,monospace;font-size:12.5px;direction:ltr;text-align:left;}

  /* ---------- Toast ---------- */
  #toast-root{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{
    padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);
    background:var(--ink);color:var(--bg);animation:toastin .18s ease-out;max-width:90vw;
  }
  .toast.error{background:var(--danger);color:#fff;}
  .toast.ok{background:var(--success);color:#fff;}
  @keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  footer.appfoot{text-align:center;padding:18px;font-size:11.5px;color:var(--ink-dim);}

  @media (max-width:640px){
    main{padding:16px;}
    .form-row{grid-template-columns:1fr;}
    header.topbar{padding:12px 16px;}
    .detail-head{padding:16px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  }
</style>
</head>

<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

/* ===================== Utilities ===================== */
function qs(sel, root){ return (root||document).querySelector(sel); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function nowIso(){ return new Date().toISOString(); }

function escapeHtml(s){
  if(s === undefined || s === null) return "";
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function fmtNum(n){
  if(n === undefined || n === null || n === "") return "—";
  var num = Number(n);
  if(isNaN(num)) return escapeHtml(n);
  return num.toLocaleString("en-US");
}
function fmtArea(n){ return n === undefined || n === null || n === "" ? "—" : fmtNum(n) + " م²"; }
function fmtPrice(n){ return n === undefined || n === null || n === "" ? "—" : fmtNum(n) + " ريال"; }
function timeAgo(iso){
  if(!iso) return "";
  var diff = Date.now() - new Date(iso).getTime();
  var min = Math.floor(diff/60000);
  if(min < 1) return "الآن";
  if(min < 60) return "قبل " + min + " د";
  var hr = Math.floor(min/60);
  if(hr < 24) return "قبل " + hr + " س";
  var day = Math.floor(hr/24);
  if(day < 30) return "قبل " + day + " يوم";
  return new Date(iso).toLocaleDateString("ar-SA");
}
function statusMeta(list, v){
  for(var i=0;i<list.length;i++){ if(list[i].v === v) return list[i]; }
  return list[0];
}
function unitCounts(project){
  var c = { total:0, available:0, reserved:0, sold:0 };
  (project.units||[]).forEach(function(u){
    c.total++;
    if(u.status === "available") c.available++;
    else if(u.status === "reserved") c.reserved++;
    else if(u.status === "sold") c.sold++;
  });
  return c;
}
async function sha256Hex(str){
  var enc = new TextEncoder().encode(str);
  var buf = await crypto.subtle.digest("SHA-256", enc);
  var arr = Array.from(new Uint8Array(buf));
  return arr.map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
}
function b64EncodeUtf8(str){
  return btoa(String.fromCharCode.apply(null, Array.from(new TextEncoder().encode(str))));
}
function b64DecodeUtf8(b64){
  var bin = atob(b64.replace(/\n/g, ""));
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

/* ===================== GitHub settings (stored locally in this browser only) ===================== */
function ghConfig(){
  var owner, repo, token;
  try{
    owner = localStorage.getItem("aqar_gh_owner") || "";
    repo = localStorage.getItem("aqar_gh_repo") || "";
    token = localStorage.getItem("aqar_gh_token") || "";
  }catch(e){ owner = repo = token = ""; }
  return { owner: owner, repo: repo, token: token, ready: !!(owner && repo && token) };
}
function saveGhConfig(owner, repo, token){
  try{
    localStorage.setItem("aqar_gh_owner", owner);
    localStorage.setItem("aqar_gh_repo", repo);
    localStorage.setItem("aqar_gh_token", token);
  }catch(e){}
}
function clearGhConfig(){
  try{
    localStorage.removeItem("aqar_gh_owner");
    localStorage.removeItem("aqar_gh_repo");
    localStorage.removeItem("aqar_gh_token");
  }catch(e){}
}

/* ===================== Toast ===================== */
function toast(msg, kind){
  var root = document.getElementById("toast-root");
  var t = document.createElement("div");
  t.className = "toast" + (kind ? " " + kind : "");
  t.textContent = msg;
  root.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3600);
}

/* ===================== Boot: load data from data/db.json ===================== */
async function boot(){
  try{ role = localStorage.getItem("aqar_role") || null; }catch(e){ role = null; }
  attachDelegation();
  try{
    var res = await fetch(DATA_PATH, { cache: "no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    DB = await res.json();
    if(!DB || !Array.isArray(DB.projects)) DB = { projects: [] };
  }catch(e){
    loadError = true;
    DB = { projects: [] };
  }
  render();
}

/* ===================== Save to GitHub (Contents API, called from the admin's own browser) ===================== */
async function saveToGitHub(commitMessage){
  var cfg = ghConfig();
  if(!cfg.ready){
    openGhSettingsModal();
    toast("اربط GitHub أول مرة عشان يصير الحفظ تلقائي", "error");
    return false;
  }
  if(saving) return false;
  saving = true;
  renderSyncPill();
  var apiUrl = "https://api.github.com/repos/" + encodeURIComponent(cfg.owner) + "/" + encodeURIComponent(cfg.repo) + "/contents/" + DATA_PATH;
  try{
    var sha = null;
    var getRes = await fetch(apiUrl, {
      headers: { "Authorization": "token " + cfg.token, "Accept": "application/vnd.github+json" }
    });
    if(getRes.status === 200){
      var getData = await getRes.json();
      sha = getData.sha;
    }else if(getRes.status !== 404){
      throw { code: "http_" + getRes.status };
    }

    var body = {
      message: commitMessage || "تحديث بيانات المشاريع",
      content: b64EncodeUtf8(JSON.stringify(DB, null, 2))
    };
    if(sha) body.sha = sha;

    var putRes = await fetch(apiUrl, {
      method: "PUT",
      headers: {
        "Authorization": "token " + cfg.token,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });

    if(putRes.status === 200 || putRes.status === 201){
      saving = false;
      renderSyncPill();
      toast("تم الحفظ على GitHub، التحديث يظهر للجميع خلال دقيقة تقريبًا", "ok");
      return true;
    }
    if(putRes.status === 409){
      saving = false;
      renderSyncPill();
      toast("في تعديل تم حفظه بنفس اللحظة، حاول تحفظ مرة ثانية", "error");
      return false;
    }
    if(putRes.status === 401 || putRes.status === 403){
      saving = false;
      renderSyncPill();
      toast("مفتاح GitHub غير صالح أو منتهي الصلاحية — افتح إعدادات GitHub وحدّثه", "error");
      return false;
    }
    throw { code: "http_" + putRes.status };
  }catch(err){
    saving = false;
    renderSyncPill();
    toast("تعذر الحفظ على GitHub، تحقق من الاتصال أو الإعدادات وحاول مرة أخرى", "error");
    return false;
  }
}

function renderSyncPill(){
  var el = document.getElementById("sync-pill");
  if(!el) return;
  var cfg = ghConfig();
  if(saving){ el.className = "sync-pill"; el.textContent = "جارٍ الحفظ..."; return; }
  if(!cfg.ready){ el.className = "sync-pill off"; el.textContent = "غير مربوط بـ GitHub"; return; }
  el.className = "sync-pill ok"; el.textContent = "مربوط ✓";
}

/* ===================== Auth ===================== */
async function tryLogin(password){
  var errBox = document.getElementById("login-err");
  if(!password){ return; }
  var hash = await sha256Hex(password);
  if(hash === ADMIN_HASH){
    role = "admin";
  }else if(hash === VIEWER_HASH){
    role = "viewer";
  }else{
    if(errBox){ errBox.textContent = "كلمة المرور غير صحيحة"; errBox.classList.add("show"); }
    return;
  }
  try{ localStorage.setItem("aqar_role", role); }catch(e){}
  render();
}
function logout(){
  role = null;
  currentProjectId = null;
  try{ localStorage.removeItem("aqar_role"); }catch(e){}
  render();
}

/* ===================== Rendering ===================== */
function render(){
  var app = document.getElementById("app");
  if(!role){
    app.innerHTML = renderLogin();
    var pw = document.getElementById("login-pw");
    if(pw) pw.focus();
    return;
  }
  var html = renderHeader();
  html += '<main>';
  if(loadError){
    html += '<div class="info-banner"><div class="ic">⚠️</div><p>تعذر تحميل ملف البيانات (' + DATA_PATH + '). إذا كنت فتحت الملف مباشرة من جهازك بدل الرابط المنشور، هذا متوقع محليًا — بعد رفعه على GitHub Pages سيعمل تلقائيًا.</p></div>';
  }
  if(currentProjectId){
    var p = DB.projects.find(function(x){ return x.id === currentProjectId; });
    if(p){ html += renderProjectDetail(p); }
    else{ currentProjectId = null; html += renderDashboard(); }
  }else{
    html += renderDashboard();
  }
  html += '</main>';
  html += '<footer class="appfoot">مشاريع عقار — لوحة إدارة داخلية</footer>';
  app.innerHTML = html;
  renderSyncPill();
}

function projectStats(){
  var totalUnits=0, available=0, reserved=0, sold=0;
  DB.projects.forEach(function(p){
    var c = unitCounts(p);
    totalUnits += c.total; available += c.available; reserved += c.reserved; sold += c.sold;
  });
  return { projects: DB.projects.length, totalUnits: totalUnits, available: available, reserved: reserved, sold: sold };
}

/* ===================== Event delegation ===================== */
function attachDelegation(){
  document.addEventListener("click", onClick);
  document.addEventListener("submit", onSubmit);
  document.addEventListener("input", onInput);
  document.addEventListener("change", onChange);
}

function onClick(e){
  var t = e.target.closest("[data-action]");
  if(!t) return;
  var action = t.getAttribute("data-action");

  if(action === "modal-overlay-close"){
    if(e.target === t) closeModal();
    return;
  }

  switch(action){
    case "go-dashboard":
      currentProjectId = null; filters = {search:"",type:"",status:""}; render(); break;
    case "logout": logout(); break;
    case "open-project":
      currentProjectId = t.getAttribute("data-id"); filters = {search:"",type:"",status:""}; render(); break;
    case "open-add-project":
      openModal(projectFormHtml(null)); break;
    case "open-gh-settings":
      openGhSettingsModal(); break;
    case "gh-disconnect":
      clearGhConfig(); closeModal(); renderSyncPill(); toast("تم فصل الربط مع GitHub", "ok"); break;
    case "open-import":
      openModal(importHtml(), true); break;
    case "edit-project": {
      var pid = t.getAttribute("data-id");
      var proj = DB.projects.find(function(x){ return x.id===pid; });
      openModal(projectFormHtml(proj));
      break;
    }
    case "delete-project": {
      var did = t.getAttribute("data-id");
      var dproj = DB.projects.find(function(x){ return x.id===did; });
      if(!dproj) return;
      var n = (dproj.units||[]).length;
      if(confirm('هل تريد حذف مشروع "' + dproj.name + '" و' + n + ' وحدة بداخله؟ لا يمكن التراجع عن هذا الإجراء.')){
        DB.projects = DB.projects.filter(function(x){ return x.id!==did; });
        currentProjectId = null;
        render();
        saveToGitHub("حذف مشروع: " + dproj.name).then(function(){});
      }
      break;
    }
    case "open-add-unit":
      openModal(unitFormHtml(t.getAttribute("data-project-id"), null)); break;
    case "edit-unit": {
      var epid = t.getAttribute("data-project-id"), euid = t.getAttribute("data-unit-id");
      var eproj = DB.projects.find(function(x){ return x.id===epid; });
      var eunit = eproj && (eproj.units||[]).find(function(x){ return x.id===euid; });
      openModal(unitFormHtml(epid, eunit));
      break;
    }
    case "delete-unit": {
      var dpid = t.getAttribute("data-project-id"), duid = t.getAttribute("data-unit-id");
      var dproj2 = DB.projects.find(function(x){ return x.id===dpid; });
      if(!dproj2) return;
      var dunit = (dproj2.units||[]).find(function(x){ return x.id===duid; });
      if(!dunit) return;
      if(confirm('هل تريد حذف الوحدة رقم "' + dunit.unitNumber + '"؟')){
        dproj2.units = (dproj2.units||[]).filter(function(x){ return x.id!==duid; });
        dproj2.updatedAt = nowIso();
        render();
        saveToGitHub("حذف وحدة: " + dunit.unitNumber).then(function(){});
      }
      break;
    }
    case "close-modal": closeModal(); break;
  }
}

function onInput(e){
  var t = e.target;
  var action = t.getAttribute && t.getAttribute("data-action");
  if(action === "dash-search"){ dashSearch = t.value; render(); focusRestoreSearch(); }
  if(action === "unit-search"){ filters.search = t.value; render(); focusRestoreSearch(); }
}
function focusRestoreSearch(){
  var el = qs('.search-input');
  if(el && document.activeElement !== el){
    var v = el.value; el.focus(); el.setSelectionRange(v.length, v.length);
  }
}

function onChange(e){
  var t = e.target;
  var action = t.getAttribute && t.getAttribute("data-action");
  if(action === "unit-filter-type"){ filters.type = t.value; render(); return; }
  if(action === "unit-filter-status"){ filters.status = t.value; render(); return; }
  if(action === "change-unit-status"){
    var pid = t.getAttribute("data-project-id"), uidv = t.getAttribute("data-unit-id");
    var proj = DB.projects.find(function(x){ return x.id===pid; });
    var unit = proj && (proj.units||[]).find(function(x){ return x.id===uidv; });
    if(unit){
      unit.status = t.value;
      proj.updatedAt = nowIso();
      saveToGitHub("تحديث حالة وحدة: " + unit.unitNumber).then(function(ok){ if(ok) toast("تم تحديث حالة الوحدة وحفظها", "ok"); });
    }
  }
}

function onSubmit(e){
  var form = e.target.closest("form[data-form]");
  if(!form) return;
  e.preventDefault();
  var kind = form.getAttribute("data-form");

  if(kind === "login"){
    var pw = form.querySelector("[name=password]").value;
    tryLogin(pw);
    return;
  }

  if(kind === "gh-settings"){
    var gfd = new FormData(form);
    var owner = (gfd.get("owner")||"").toString().trim();
    var repo = (gfd.get("repo")||"").toString().trim();
    var token = (gfd.get("token")||"").toString().trim();
    saveGhConfig(owner, repo, token);
    closeModal();
    renderSyncPill();
    toast("تم حفظ إعدادات GitHub في هذا المتصفح", "ok");
    return;
  }

  if(kind === "import"){
    var ifd = new FormData(form);
    var raw = (ifd.get("payload")||"").toString().trim();
    var data;
    try{ data = JSON.parse(raw); }
    catch(err){ toast("النص المستورد ليس JSON صالح", "error"); return; }
    var incoming = Array.isArray(data) ? data : (data.projects ? data.projects : [data]);
    if(!Array.isArray(incoming) || incoming.length === 0){ toast("ما فيه مشاريع داخل النص المستورد", "error"); return; }
    var added = 0, updated = 0;
    incoming.forEach(function(np){
      if(!np || !np.name) return;
      if(!np.id) np.id = uid();
      if(!np.units) np.units = [];
      np.units.forEach(function(u){ if(!u.id) u.id = uid(); });
      np.updatedAt = nowIso();
      if(!np.createdAt) np.createdAt = nowIso();
      var idx = DB.projects.findIndex(function(x){ return x.id === np.id; });
      if(idx > -1){ DB.projects[idx] = np; updated++; }
      else{ DB.projects.push(np); added++; }
    });
    closeModal();
    render();
    saveToGitHub("استيراد من Claude: " + added + " جديد، " + updated + " محدّث").then(function(ok){
      if(ok) toast("تم الاستيراد والحفظ (" + added + " جديد، " + updated + " محدّث)", "ok");
    });
    return;
  }

  if(kind === "project"){
    var fd = new FormData(form);
    var id = form.getAttribute("data-id");
    var data2 = {
      name: (fd.get("name")||"").toString().trim(),
      city: (fd.get("city")||"").toString().trim(),
      district: (fd.get("district")||"").toString().trim(),
      status: (fd.get("status")||"planning").toString(),
      description: (fd.get("description")||"").toString().trim()
    };
    if(!data2.name || !data2.city){ toast("يرجى تعبئة اسم المشروع والمدينة", "error"); return; }
    var isNew = !id;
    if(id){
      var proj = DB.projects.find(function(x){ return x.id===id; });
      Object.assign(proj, data2);
      proj.updatedAt = nowIso();
    }else{
      DB.projects.push(Object.assign({ id: uid(), units: [], createdAt: nowIso(), updatedAt: nowIso() }, data2));
    }
    closeModal();
    render();
    saveToGitHub((isNew ? "إضافة مشروع: " : "تعديل مشروع: ") + data2.name).then(function(ok){ if(ok) toast("تم حفظ المشروع", "ok"); });
    return;
  }

  if(kind === "unit"){
    var ufd = new FormData(form);
    var pid = form.getAttribute("data-project-id");
    var uidv = form.getAttribute("data-id");
    var proj2 = DB.projects.find(function(x){ return x.id===pid; });
    if(!proj2) return;
    var featuresRaw = (ufd.get("features")||"").toString();
    var features = featuresRaw.split(/[،,]/).map(function(s){ return s.trim(); }).filter(Boolean);
    var udata = {
      unitNumber: (ufd.get("unitNumber")||"").toString().trim(),
      floor: (ufd.get("floor")||"").toString().trim(),
      type: (ufd.get("type")||UNIT_TYPES[0]).toString(),
      area: ufd.get("area") ? Number(ufd.get("area")) : "",
      rooms: ufd.get("rooms") ? Number(ufd.get("rooms")) : "",
      bathrooms: ufd.get("bathrooms") ? Number(ufd.get("bathrooms")) : "",
      features: features,
      price: ufd.get("price") ? Number(ufd.get("price")) : "",
      status: (ufd.get("status")||"available").toString(),
      notes: (ufd.get("notes")||"").toString().trim()
    };
    if(!udata.unitNumber || !udata.floor || udata.area === "" || udata.rooms === ""){
      toast("يرجى تعبئة الحقول المطلوبة (رقم الوحدة، الدور، المساحة، الغرف)", "error"); return;
    }
    if(uidv){
      var unit = (proj2.units||[]).find(function(x){ return x.id===uidv; });
      Object.assign(unit, udata);
    }else{
      proj2.units = proj2.units || [];
      proj2.units.push(Object.assign({ id: uid() }, udata));
    }
    proj2.updatedAt = nowIso();
    closeModal();
    render();
    saveToGitHub("حفظ وحدة: " + udata.unitNumber).then(function(ok){ if(ok) toast("تم حفظ الوحدة", "ok"); });
    return;
  }
}

boot();
</script>
</body>
</html>
